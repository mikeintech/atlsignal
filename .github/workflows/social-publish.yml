name: Publish ATLSignal to Instagram and Threads

on:
  workflow_dispatch:
  schedule:
    # Run just after each 7:35, 12:15 and 18:35 ET slot in both EDT and EST.
    - cron: "45 11,12,22,23 * * *"
    - cron: "25 16,17 * * *"

permissions:
  contents: write

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish due reviewed packages
        run: node scripts/dispatch-social.mjs
        env:
          SOCIAL_PUBLISH_ENDPOINT: ${{ secrets.SOCIAL_PUBLISH_ENDPOINT }}
          SOCIAL_PUBLISH_TOKEN: ${{ secrets.SOCIAL_PUBLISH_TOKEN }}
      - name: Preserve platform receipts
        run: |
          if ! git diff --quiet -- data/social-dispatch.json; then
            git config user.name "atlsignal-social[bot]"
            git config user.email "atlsignal-social[bot]@users.noreply.github.com"
            git add data/social-dispatch.json
            git commit -m "Record ATLSignal social delivery [skip ci]"
            git push
          fi
