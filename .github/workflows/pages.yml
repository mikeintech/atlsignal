name: Deploy ATLSignal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "15 11,15,19,23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run the ATLSignal newsroom
        run: |
          for attempt in 1 2 3; do
            if npm run newsroom; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Newsroom sweep attempt $attempt failed; retrying after a short backoff."
            sleep $((attempt * 15))
          done
        env:
          STRICT_NEWSROOM: "1"
      - run: npm run build:github
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ENDPOINT }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENDPOINT }}
      - name: Preserve the newsroom ledger
        run: |
          if ! git diff --quiet -- data/newsroom.json; then
            git config user.name "atlsignal-newsroom[bot]"
            git config user.email "atlsignal-newsroom[bot]@users.noreply.github.com"
            git add data/newsroom.json
            git commit -m "Refresh ATLSignal publishing ledgers [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  index:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Notify IndexNow of published URLs
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
