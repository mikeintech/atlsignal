name: Deploy ATLSignal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "15 11,15,19,23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Run the ATLSignal newsroom
        run: npm run newsroom
        env:
          STRICT_NEWSROOM: "1"
          SOCIAL_PUBLIC_SITE_URL: ${{ vars.SOCIAL_PUBLIC_SITE_URL }}
          SOCIAL_ASSET_BASE_URL: ${{ vars.SOCIAL_ASSET_BASE_URL }}
      - run: npm run build:github
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_NEWSLETTER_ENDPOINT: ${{ vars.NEXT_PUBLIC_NEWSLETTER_ENDPOINT }}
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENDPOINT }}
      - name: Preserve the newsroom ledger
        run: |
          if ! git diff --quiet -- data/newsroom.json data/social-desk.json data/social-dispatch.json; then
            git config user.name "atlsignal-newsroom[bot]"
            git config user.email "atlsignal-newsroom[bot]@users.noreply.github.com"
            git add data/newsroom.json data/social-desk.json data/social-dispatch.json
            git commit -m "Refresh ATLSignal publishing ledgers [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
